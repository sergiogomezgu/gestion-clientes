services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientes
      POSTGRES_USER: clientes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes -d clientes"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://clientes:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@db:5432/clientes
      API_TOKEN: ${API_TOKEN:?Copia .env.example a .env y configura API_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: